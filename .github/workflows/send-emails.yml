name: Send invoices

on:
  schedule:
    # Runs every month on the 17th at 7:25 AM Sri Lanka time
    - cron: '55 1 17 * *'

  # Allows manual execution if needed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.23'

      - name: Install dependencies
        run: go mod tidy

      - name: Install wkhtmltopdf
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf

      - name: Send Email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
          EMPLOYEE_NUMBER: ${{ secrets.EMPLOYEE_NUMBER }}
          AMOUNT: ${{ secrets.AMOUNT }}
          BANK: ${{ secrets.BANK }}
          BANK_BRANCH: ${{ secrets.BANK_BRANCH }}
          ACCOUNT_NO: ${{ secrets.ACCOUNT_NO }}
          SWIFT_CODE: ${{ secrets.SWIFT_CODE }}
          BANK_CODE: ${{ secrets.BANK_CODE }}
          BRANCH_CODE: ${{ secrets.BRANCH_CODE }}
          NAME: ${{ secrets.NAME }}
          ADDRESS_LINE_1: ${{ secrets.ADDRESS_LINE_1 }}
          ADDRESS_LINE_2: ${{ secrets.ADDRESS_LINE_2 }}
          CITY: ${{ secrets.CITY }}
          POSTAL_CODE: ${{ secrets.POSTAL_CODE }}
          COUNTRY: ${{ secrets.COUNTRY }}
          BILL_TO: ${{ secrets.BILL_TO }}
          BILL_TO_ADDRESS: ${{ secrets.BILL_TO_ADDRESS }}
        run: go run main.go

      - name: Keep repository active
        if: ${{ always() }}
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-scheduled-run
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-scheduled-run
          git commit -m "chore: record invoice schedule activity [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
